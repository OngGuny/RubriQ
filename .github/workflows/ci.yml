name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # LLM 호출 없는 빠른 게이트. 모든 푸시에서 돈다.
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy src eval
      - name: pytest (unit)
        run: uv run pytest tests/unit -v

  # 골든셋 재평가. 실제 LLM 호출이라 비용이 든다 → 수동/야간만.
  regression:
    name: golden set regression
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest (regression)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUBRIQ_REGRESSION_QWK_THRESHOLD: "0.60"
        run: uv run pytest -m regression -v
      - name: upload report
        if: always()   # fail 했을 때의 숫자가 가장 필요하다
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: eval/reports/
